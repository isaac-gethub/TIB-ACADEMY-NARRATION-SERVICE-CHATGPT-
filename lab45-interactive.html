<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 45 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 45 — The Off-Cycle Exception</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab45.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Establish off-cycle population","objective":"Scope bonuses, corrections and severance payments.","action":"Obtain the 22 fiscal-quarter off-cycle payroll runs. Record source, period, entity and report parameters; preserve raw export.","evidence":"THORNFIELD-B45-PY-03-OffCycleRunPopulation.xlsx","screen":"Off-cycle payroll population","fields":["Quarterly runs: 22","Types: bonus, correction, severance"],"question":"Which runs belong in the segregation test?","options":["All 22 off-cycle runs","Only the eight justification samples"],"answer":0},{"title":"2. Compare requester and approver","objective":"Test independent approval for every run.","action":"Review requester and approver identities on all 22 runs. Twenty-one show different people; one bonus correction shows the same person in both roles.","evidence":"THORNFIELD-B45-PY-03-RequesterApprover-Comparison.xlsx","screen":"Payroll approval log","fields":["Separate approvers: 21","Same person: 1 bonus correction"],"question":"What is the identified SoD exception?","options":["One bonus correction","All 22 runs"],"answer":0},{"title":"3. Check payment justifications","objective":"Validate documented business reasons and amounts.","action":"Sample eight runs and compare payment details to HR and Finance supporting records. All eight match within immaterial rounding.","evidence":"THORNFIELD-B45-PY-03-JustificationSample.pdf","screen":"Justification evidence","fields":["Payments tested: 8","Matched: 8"],"question":"Do valid payment amounts remove the SoD exception?","options":["No, approval independence is separate","Yes, automatically"],"answer":0},{"title":"4. Analyze off-cycle trends","objective":"Identify potential routine bypass of normal payroll.","action":"Compare off-cycle payments as a share of total payroll over the trailing four quarters. The proportion rises from 2.1% to 6.4%. Investigate the cause.","evidence":"THORNFIELD-B45-PY-03-TrendAnalysis.xlsx","screen":"Quarterly trend","fields":["Earlier share: 2.1%","Later share: 6.4%"],"question":"What does the trend establish?","options":["Need for root-cause review","Proof of fraud"],"answer":0},{"title":"5. Recommend controls and follow-up","objective":"Separate SoD remediation from process trend investigation.","action":"Document the single approval conflict, recommend a second approver above a materiality threshold, and separately investigate whether regular-cycle breakdown, business events or legitimate exceptions explain the rise.","evidence":"THORNFIELD-B45-PY-03-TrendAnalysis.xlsx","screen":"Payroll control conclusion","fields":["SoD exception: 1 of 22","Trend follow-up: open"],"question":"What are the two actions?","options":["Approval safeguard and trend root-cause review","Ignore the trend because sampled amounts matched"],"answer":0}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab45_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab45_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab45-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 45 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab45_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
