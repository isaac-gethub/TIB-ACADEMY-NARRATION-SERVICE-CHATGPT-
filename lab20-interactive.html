<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 20 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 20 — The Back Door</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab20.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Inventory custom transactions","objective":"Identify sensitive Z/Y custom transactions for authorization testing.","action":"Search SE93 for custom transaction namespaces. Case inventory: 112 custom transactions; nine affect sensitive vendor, payment or journal processes.","evidence":"THORNFIELD-B20-CH-04-SE93-CustomTxnInventory.xlsx","screen":"Illustrative SE93 inventory","fields":["Custom transactions: 112","Sensitive: 9"],"question":"How many custom transactions touched sensitive processes?","options":["9","112"],"answer":0},{"title":"2. Compare authorization checks","objective":"Compare custom transaction checks to the standard transaction requirements.","action":"Review linked ABAP program in display mode and compare its checks against SU24. ZFI-VENDOR-QUICK omitted F-LFA1-BUK and checked only general activity.","evidence":"THORNFIELD-B20-CH-04-AuthorityCheck-Comparison.xlsx","screen":"Illustrative SU24 comparison","fields":["Custom transaction: ZFI-VENDOR-QUICK","Missing object: F-LFA1-BUK"],"question":"What key control was omitted?","options":["F-LFA1-BUK","SM58 queue"],"answer":0},{"title":"3. Evaluate restricted-user test","objective":"Determine whether the omitted check led to a functional access gap.","action":"Review the approved restricted-user test evidence. In the case, the user changed vendor bank details via the custom transaction despite a standard transaction restriction. This is a confirmed control failure.","evidence":"THORNFIELD-B20-CH-04-LiveTest-UnauthorizedChange.png","screen":"Illustrative controlled test evidence","fields":["Standard route: restricted","Custom route: permitted"],"question":"What does the test establish?","options":["Confirmed unauthorized sensitive action","Only a cosmetic tile issue"],"answer":0},{"title":"4. Review broader SCI results","objective":"Identify other custom programs with the same omitted authorization pattern.","action":"Review SCI Code Inspector findings for the custom code inventory. Two additional transactions from the same developer showed the omitted-check pattern; distinguish code findings from the separately confirmed live bypass.","evidence":"THORNFIELD-B20-CH-04-SCI-PatternScan-Result.png","screen":"Illustrative SCI results","fields":["Confirmed live bypass: 1","Additional pattern matches: 2"],"question":"Were all three independently live-tested in the case?","options":["Yes","No; one live test and two code-pattern findings"],"answer":1},{"title":"5. Recommend immediate and systemic remediation","objective":"Address the affected code and the recurring review weakness.","action":"Recommend remediation of all three affected custom transactions and a mandatory SU24-based authorization review gate for sensitive custom code. Record the common developer and code-review training issue.","evidence":"SE93-CustomTxnInventory.xlsx; AuthorityCheck-Comparison.xlsx; LiveTest-UnauthorizedChange.png; SCI-PatternScan-Result.png","screen":"Illustrative control conclusion","fields":["Affected transactions: 3","Confirmed live bypass: 1","Review gate: SU24-based"],"question":"Which response addresses recurrence?","options":["Mandatory authorization review for sensitive code","Fix only the demonstrated transaction"],"answer":0}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab20_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab20_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab20-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 20 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab20_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
