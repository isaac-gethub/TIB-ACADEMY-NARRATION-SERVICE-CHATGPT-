<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 12 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 12 — The Four-Day Clock</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab12.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define disclosure escalation test","objective":"Verify security incidents meeting defined escalation criteria reached the disclosure committee without unreasonable delay and materiality decisions were documented.","action":"Define incident period, detection and containment timestamps, documented escalation policy and committee notification requirements. Capture system, client, sources, evidence owner and test criteria before extraction.","evidence":"THORNFIELD-B12-BP-02-IncidentRecord.pdf","screen":"Illustrative incident escalation scope","fields":["Detection timestamp: ______","Containment timestamp: ______","Escalation criterion: without unreasonable delay"],"question":"Who should determine materiality for disclosure?","options":["Security operations alone","Disclosure committee informed by Legal and Finance"],"answer":1},{"title":"2. Validate security logs and retention","objective":"Establish what SAP security logs captured during the incident and whether the evidence population is reliable.","action":"Review SM21 system log, SM20 security audit log and SM19 audit configuration and retention for the incident period. Retain selection criteria, screenshots and completeness limitations.","evidence":"THORNFIELD-B12-BP-02-SM21-Extract.png; THORNFIELD-B12-BP-02-SM20-Result.png; THORNFIELD-B12-BP-02-SM19-Configuration.png","screen":"Illustrative SAP incident evidence","fields":["SM21: system log","SM20: audit log","SM19: logging configuration"],"question":"Why review SM19 configuration?","options":["To establish what logging was enabled","To determine materiality automatically"],"answer":0},{"title":"3. Reconstruct incident timeline","objective":"Compare detection and containment to disclosure-committee escalation.","action":"Obtain the original security incident record rather than relying on committee minutes. Reconstruct detection, containment and escalation timestamps. Case: 23 days elapsed before the incident reached the disclosure committee.","evidence":"THORNFIELD-B12-BP-02-IncidentRecord.pdf","screen":"Illustrative incident chronology","fields":["Detection/containment: day 0","Committee escalation: day 23","Elapsed: 23 days"],"question":"What elapsed time did the test establish?","options":["Four days","Twenty-three days"],"answer":1},{"title":"4. Check related production changes and criteria","objective":"Test whether emergency changes explain the event and whether escalation thresholds were actionable.","action":"Cross-reference incident dates to STMS production import history; no related production change was identified in the case. Review policy wording: 'escalate significant incidents' lacked specific actionable thresholds.","evidence":"THORNFIELD-B12-BP-02-STMS-CrossReference.png","screen":"Illustrative STMS and policy review","fields":["Related production change: none found","Policy phrase: significant incidents","Specific thresholds: absent"],"question":"What policy design weakness was identified?","options":["Specific numeric thresholds were clear","Escalation criteria were too broad"],"answer":1},{"title":"5. Conclude without making legal determination","objective":"Report the escalation control finding while reserving disclosure obligations for the appropriate decision makers.","action":"Document the 23-day delay and nonspecific criteria as the supported control finding. Note Security's view that impact was immaterial without adopting it as the test conclusion. Refer any disclosure obligation and materiality determination to Legal and the disclosure committee. Index all five evidence items.","evidence":"SM21 extract; SM20 result; SM19 configuration; incident record; STMS cross-reference","screen":"Illustrative reviewer conclusion","fields":["Escalation: 23 days","Criteria: insufficiently specific","Disclosure obligation: Legal/committee"],"question":"Does this lab determine that a legal disclosure obligation was triggered?","options":["Yes","No; that is outside the test scope"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab12_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab12_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab12-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 12 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab12_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
