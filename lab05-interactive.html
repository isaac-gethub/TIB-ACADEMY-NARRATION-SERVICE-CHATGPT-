<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 5 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 5 — The Cutover</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab05.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define cutover window and scope","objective":"Verify all transports migrated during the elevated-volume cutover window had appropriate standard or emergency authorisation.","action":"Define Friday 18:00 through Sunday 24:00, included landscape systems, complete transport population and exception criteria. Capture source, client, preparer and extraction date.","evidence":"THORNFIELD-B05-CH-02-SE03-CutoverPopulation.png","screen":"Cutover scope workpaper","fields":["Start Friday 18:00","End Sunday 24:00","Included systems: 4 (case)"],"question":"Which transports belong in scope?","options":["All in-window transports across all four systems","Only the transports with tickets"],"answer":0},{"title":"2. Extract full SE03 population","objective":"Preserve a complete and reproducible population for cutover testing.","action":"Open /nSE03 and use the applicable transport organizer tools/report to scope to the cutover window. Execute and export the complete transport list across included systems. Reconcile raw results.","evidence":"THORNFIELD-B05-CH-02-SE03-CutoverPopulation.png","screen":"Illustrative SE03 transport organizer","fields":["Cutover population: 214","Systems: 4","Typical monthly transports: 15–20"],"question":"Why preserve the full list?","options":["To select only approved transports","To establish completeness and avoid sampling bias"],"answer":1},{"title":"3. Select and test elevated-risk sample","objective":"Apply a larger sample justified by increased volume and risk.","action":"Document sample-size rationale. The case uses 40 transports rather than a typical 8–10. Match each sampled transport to standard or emergency change approvals and migration timestamps.","evidence":"THORNFIELD-B05-CH-02-SampleSelection-Rationale.xlsx","screen":"Illustrative sampling workpaper","fields":["Population: 214","Sample: 40","Standard monthly sample: 8–10"],"question":"What drives the sample size?","options":["Risk and elevated transaction volume","The number of tickets already approved"],"answer":0},{"title":"4. Investigate late emergency forms","objective":"Determine whether emergency documentation complied with the 48-hour SLA.","action":"Case: 36 of 40 sampled transports had matching tickets within the required window. Four emergency justification forms were completed 1–3 hours after the 48-hour SLA, during the highest-volume overnight period. Compare approval, migration and evidence timestamps; do not treat ticket existence as timely approval.","evidence":"THORNFIELD-B05-CH-02-LateEmergencyForms-Detail.xlsx","screen":"Illustrative emergency timing review","fields":["36 within window","4 forms 1–3 hours late","SLA: 48 hours"],"question":"Can a late form prove timely control performance?","options":["Yes, if a ticket number exists","No; the timestamps determine timeliness"],"answer":1},{"title":"5. Conclude and package evidence","objective":"Document partial control performance and the four late emergency justifications.","action":"Conclude the control operated for 36 of 40 sampled transports; four emergency forms missed the required SLA. Recommend a second on-call approver during high-volume cutover windows. Index SE03 population, sample rationale and late-form detail. Separate management explanations from observed facts.","evidence":"THORNFIELD-B05-CH-02-SE03-CutoverPopulation.png; SampleSelection-Rationale.xlsx; LateEmergencyForms-Detail.xlsx","screen":"Illustrative cutover conclusion","fields":["Result: 36/40 compliant","Exceptions: 4 late emergency forms","Remediation: second on-call approver"],"question":"What is the key lesson?","options":["A ticket alone proves approval","Approval and documentation timing must support the assertion"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab05_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab05_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab05-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 5 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab05_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
