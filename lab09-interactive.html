<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 9 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 9 — The Tip Line</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab09.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define independent investigation","objective":"Reconstruct a specific journal entry flagged by an anonymous tip without relying on the original tester's conclusion.","action":"Record the document, company code, fiscal year, period and exception criteria. Establish the original posting and relevant source records independently, not from the original summary.","evidence":"THORNFIELD-B09-BP-05-SourceDataRequest-Email.pdf","screen":"Investigation scope","fields":["Document number: ______","Company code/year: ______","Source data owner: ______"],"question":"Where should reconstruction start?","options":["The original tester's conclusion","Independent source records"],"answer":1},{"title":"2. Reconstruct ledger and change history","objective":"Determine the full entry history and identify changes after posting.","action":"Use /nFBL3N with G/L and period, /nSE16N for BKPF/BSEG as appropriate and /nFB03 to inspect document header and change references. Case: two changes after posting, one amount adjustment and one cost-center change, neither in the original workpaper.","evidence":"THORNFIELD-B09-BP-05-FB03-ChangeHistory.png","screen":"Illustrative FB03 change history","fields":["Post-posting changes: 2","Amount changed: yes","Cost center changed: yes"],"question":"How many undisclosed changes were found?","options":["Zero","Two"],"answer":1},{"title":"3. Obtain underlying support directly","objective":"Verify the source of the booked estimate independently.","action":"Request raw underlying support from the original source-system owner, bypassing the preparer's summary spreadsheet. Retain the direct request and source lineage. Do not assume a summary establishes completeness or accuracy.","evidence":"THORNFIELD-B09-BP-05-SourceDataRequest-Email.pdf","screen":"Illustrative direct source-data request","fields":["Original support: summary spreadsheet","Underlying source: requested","Evidence provenance: ______"],"question":"What was missing from original support?","options":["Underlying source data","A summary spreadsheet"],"answer":0},{"title":"4. Independently recompute the estimate","objective":"Compare a reproducible estimate to the booked amount.","action":"Recompute from source data where possible and preserve assumptions and calculations. The fictional case showed a 14 percent variance from the booked amount, outside the stated reasonable estimation range. Separate observations from allegations.","evidence":"THORNFIELD-B09-BP-05-IndependentRecomputation.xlsx","screen":"Illustrative variance analysis","fields":["Variance: 14%","Reasonable range: exceeded","Reviewer: ______"],"question":"Does the variance itself prove misconduct?","options":["Yes","No; escalate findings for independent determination"],"answer":1},{"title":"5. Conclude and escalate appropriately","objective":"Document reconstruction findings without deciding legal reportability.","action":"Report the two undisclosed post-posting changes and 14 percent independent recomputation variance. Refer findings to Internal Audit for reportability determination, with Legal as appropriate. Require source data rather than prepared summaries for future support. Index change history, recomputation and source-data request.","evidence":"FB03 change history; independent recomputation; source-data request","screen":"Illustrative investigation conclusion","fields":["Two undisclosed changes","14% variance","Reportability: Internal Audit/Legal determination"],"question":"Who determines whether the matter is reportable?","options":["The lab tester alone","Internal Audit/Legal as appropriate"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab09_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab09_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab09-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 9 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab09_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
