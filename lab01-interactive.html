<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 1 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 1 — The Access List</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab01.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{title:'1. Define the control objective',audio:1,objective:'Verify no production user holds vendor-master-maintenance and payment-run execution access without a substantiated mitigation, for the defined company codes and snapshot.',action:'Before entering SAP, document the production system/client, company codes, population, point-in-time snapshot, risk pairing and exception criteria. Obtain reviewer agreement on the scope.',evidence:'Signed scope worksheet, population definition and test criteria.',screen:'Workpaper W01 · Control scope',fields:['System / client: ______','Company codes: ______','Snapshot date: ______','Exception definition: ______'],question:'What defines the report population?',options:['Whichever report is easiest to run','The control assertion and agreed scope'],answer:1},{title:'2. GRC access risk analysis',audio:2,objective:'Identify unmitigated SoD conflicts and reconcile against the mitigated-inclusive population.',action:'Run GRC Access Risk Analysis at User Level, Report Type Detail, procure-to-pay ruleset. Capture the first run with Include Mitigated Risks unchecked. Run again with that setting checked; retain both selection screens and exports.',evidence:'GRC selection criteria, timestamps, unmitigated and mitigated-inclusive result files and count reconciliation.',screen:'Illustrative GRC Access Risk Analysis',fields:['Analysis level: User','Report type: Detail','Ruleset: Procure to Pay','Include mitigated risks: ☐ / ☑'],question:'Which parameter changes between the two runs?',options:['Analysis level','Include Mitigated Risks'],answer:1},{title:'3. Trace access in SUIM / PFCG',audio:3,objective:'Independently determine whether the flagged user obtains both capabilities through one role or separate roles.',action:'In SAP GUI use /nSUIM to inspect Roles → By User Assignment. Use /nPFCG in Display mode for each relevant role, inspect Menu and Authorizations, and display authorization data. Do not modify roles.',evidence:'SUIM role assignment listing and PFCG display-only authorization trace, with SID/client and capture date.',screen:'Illustrative SAP GUI navigation',fields:['Command: /nSUIM','Roles → By User Assignment','Command: /nPFCG','Role: [display only]'],question:'Both rights in a single role indicate what?',options:['Role design issue','No SoD concern'],answer:0},{title:'4. Assess the case conflicts',audio:4,objective:'Interpret the Thornfield training case without treating fictional counts as live SAP results.',action:'Reconcile 41 case conflicts: 38 with recorded mitigation and 3 without. Trace the flagged user with both capabilities in one role. Record the three unmitigated conflicts as exceptions. Plan separate operating-effectiveness testing of the 38 recorded mitigations.',evidence:'Conflict count reconciliation, exception register, role trace and mitigation test population.',screen:'Illustrative conflict reconciliation',fields:['Total conflicts: 41','Recorded mitigations: 38','Unmitigated: 3','Traced role-design exception: 1'],question:'Are 38 recorded mitigations automatically effective?',options:['Yes','No; test operating effectiveness'],answer:1},{title:'5. Conclude and prepare for review',audio:5,objective:'Produce a conclusion that an independent reviewer can reperform.',action:'Index the scope, two GRC exports, SUIM/PFCG traces and exception register. Conclude on the unmitigated SoD risk, recommend remediation of role design, and separately assess recorded mitigations. Clearly identify evidence gaps.',evidence:'Workpaper conclusion, evidence index, exception owner, remediation recommendation and reviewer signoff.',screen:'Illustrative workpaper closeout',fields:['Evidence references: ______','Exceptions: ______','Conclusion: ______','Reviewer: ______'],question:'Which is the strongest conclusion?',options:['All access is safe because mitigations are recorded','An unmitigated conflict exists; role redesign and mitigation testing are required'],answer:1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab01_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab01_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab01-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 1 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab01_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
