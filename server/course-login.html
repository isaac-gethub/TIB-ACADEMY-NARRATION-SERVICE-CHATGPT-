<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy — Course Sign In</title><style>body{font:16px/1.6 system-ui;background:#edf2f8;color:#173052;margin:0}main{max-width:520px;margin:8vh auto;padding:28px;background:white;border-radius:12px}label{display:block;margin-top:16px}input{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #bbc9db;border-radius:7px}button{background:#173f70;color:white;padding:11px 18px;border:0;border-radius:8px;margin-top:18px;cursor:pointer}a{color:#173f70}#message{min-height:24px}</style></head><body><main><h1>TIB Academy</h1><p>Sign in with your existing TIB Academy account. An active enrollment in this course is required.</p><form id="login"><label for="email">Email / User ID</label><input id="email" type="email" autocomplete="username" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><p id="message" role="status"></p><button id="signin" type="submit">Sign in →</button></form><p><a href="/trainee-skills-career-report.html">View course career readiness report</a></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.117.3';const sb=createClient('https://blfgwysgekfqhcafofhe.supabase.co','sb_publishable_ThLetpd4hj49fjce-kXoFA_v4ghwIqV');document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('signin'),message=document.getElementById('message');button.disabled=true;message.textContent='Verifying access…';try{const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pw').value});if(error)throw Error('Login failed. Check your credentials.');document.getElementById('pw').value='';const response=await fetch('/api/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:data.session.access_token})});if(!response.ok)throw Error('Course sign-in could not be completed. Please reload this page and try again.');window.location.replace('/index.html')}catch(e){message.textContent=e.message;button.disabled=false}};</script></body></html>
