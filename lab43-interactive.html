<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 43 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 43 — The Employee Who Wasn't</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab43.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Establish active employee population","objective":"Verify active employee identities in payroll.","action":"Extract 1,842 active employees and Infotype 0009 bank account details using read-only SE16N reporting. Preserve population criteria.","evidence":"THORNFIELD-B43-PY-01-BankDetails-DuplicateExtract.xlsx","screen":"Employee bank details","fields":["Active employees: 1,842","Infotype: 0009"],"question":"What population is being assessed?","options":["All active employees","Only employees with duplicate banks"],"answer":0},{"title":"2. Identify duplicate bank accounts","objective":"Detect shared payment destinations.","action":"Sort bank account numbers; three account numbers each appear on two employee IDs. Compare those three pairs to Infotype 0006 addresses; two pairs share addresses.","evidence":"THORNFIELD-B43-PY-01-AddressExtract-DuplicateCrossRef.xlsx","screen":"Duplicate cross-reference","fields":["Duplicate account pairs: 3","Also sharing address: 2"],"question":"Does a shared account alone prove a ghost employee?","options":["No, investigate identity","Yes, automatically"],"answer":0},{"title":"3. Verify employee records","objective":"Inspect employment status and cost centers.","action":"Review each flagged employee in PA20 display mode. Seek independent manager confirmation for the two pairs sharing both account and address.","evidence":"THORNFIELD-B43-PY-01-PA20-MasterRecordReview.pdf","screen":"PA20 employee master","fields":["Flagged account pairs: 3","Address-matched pairs: 2"],"question":"What independent confirmation matters?","options":["Current manager and work activity","Bank account match alone"],"answer":0},{"title":"4. Separate legitimate from unresolved","objective":"Evaluate corroborating employment evidence.","action":"One address-matched pair are siblings confirmed actively working. Another includes an unconfirmed identity with 14 biweekly paychecks and no timesheet or badge activity on file.","evidence":"THORNFIELD-B43-PY-01-ManagerConfirmation-Memo.pdf","screen":"Manager and activity verification","fields":["Confirmed siblings: 1 pair","Unconfirmed identity: 1","Paychecks: 14"],"question":"What remains an open risk?","options":["Unconfirmed paid identity","Confirmed siblings"],"answer":0},{"title":"5. Escalate potential payroll exposure","objective":"Protect evidence and quantify possible loss.","action":"Escalate unresolved identity to Internal Audit and HR Security; calculate exposure from 14 paychecks and check whether receiving account is active. Do not assert fraud before investigation.","evidence":"THORNFIELD-B43-PY-01-ManagerConfirmation-Memo.pdf","screen":"Exception conclusion","fields":["Exposure amount: to quantify","Disposition: escalate"],"question":"What is the appropriate next action?","options":["Immediate investigation and exposure calculation","Dismiss because two people may share an account"],"answer":0}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab43_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab43_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab43-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 43 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab43_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
