<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 4 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 4 — The Next Badge</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab04.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define the new-hire population","objective":"Verify newly provisioned users received current approved roles, not retired templates.","action":"Obtain the HR new-hire and transfer population for the test period. Cross-reference users against active SU01 accounts. Define exceptions before sampling.","evidence":"THORNFIELD-B04-AC-04-HR-NewHireReport.xlsx","screen":"HR population and SU01","fields":["Period: ______","System/client: ______","New hires/transfers: ______"],"question":"Which is the population source?","options":["HR new-hire/transfer report","Only the GRC-approved requests"],"answer":0},{"title":"2. Compare requests with provisioned access","objective":"Confirm requested, approved and actually provisioned roles align with current design.","action":"Review GRC Access Request History for sampled new hires. Open /nSU01 in display mode and compare assigned roles and profiles with approved requests and the current role catalog.","evidence":"THORNFIELD-B04-AC-04-AccessRequestHistory-Sample.png","screen":"Illustrative GRC request / SU01","fields":["Requested role: ______","Approved role: ______","Provisioned role: ______"],"question":"Is manager approval alone enough?","options":["Yes","No; provisioned role must also match current design"],"answer":1},{"title":"3. Validate role design in PFCG","objective":"Determine whether assigned access matches the current role design.","action":"Open /nPFCG in display mode, inspect Menu, Authorizations and Display Authorization Data. Compare legacy composite role objects with current role design. Do not change roles.","evidence":"THORNFIELD-B04-AC-04-PFCG-RoleCompare.png","screen":"Illustrative PFCG display","fields":["Current role: ______","Legacy role: ______","Authorization difference: ______"],"question":"What is the safe testing approach?","options":["Modify the role during testing","Remain in display mode and preserve evidence"],"answer":1},{"title":"4. Investigate two exceptions","objective":"Explain the observed mismatch without assuming the root cause.","action":"Thornfield case: of 20 sampled requests, 18 matched current design and 2 were provisioned using a composite role retired six months earlier. Both had the same approving manager. Investigate whether the approval interface still presents the retired role; record the manager question for reviewer discussion.","evidence":"HR population, two GRC requests and PFCG comparison.","screen":"Illustrative 20-request test","fields":["20 tested","18 aligned","2 legacy composite roles","One common approver"],"question":"How should the common approver be treated?","options":["Proven root cause","Reviewer investigation item pending evidence"],"answer":1},{"title":"5. Conclude and package evidence","objective":"Report the control outcome with traceable evidence and practical remediation.","action":"Conclude that the new-hire provisioning control failed for 2 of 20 requests in the fictional case. Recommend removing the retired composite role from the approval interface and refreshing approver awareness. Index all three exhibits, reconcile sample to population and distinguish confirmed findings from reviewer questions.","evidence":"THORNFIELD-B04-AC-04-HR-NewHireReport.xlsx; AccessRequestHistory-Sample.png; PFCG-RoleCompare.png","screen":"Illustrative workpaper conclusion","fields":["Finding: 2/20","Remediation: retire legacy role from interface","Reviewer: ______"],"question":"What supports the conclusion?","options":["Only the approver's name","Reconciled population, request history and role comparison"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab04_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab04_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab04-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 4 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab04_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
