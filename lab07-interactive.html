<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 7 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 7 — The Fourth Chair</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab07.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define Procurement SoD risk","objective":"Verify vendor master maintenance and purchase-order approval are segregated, with any mitigation substantiated, and PO release independent of creation.","action":"Define Procurement population, period, risk IDs, release threshold and evidence of mitigating controls. Do not assume the Accounts Payable SoD ruleset covers Procurement.","evidence":"THORNFIELD-B07-AC-05-GRC-ProcurementScope-Result.png","screen":"Illustrative Procurement risk scope","fields":["Risk: vendor master create + PO approval","Scope: Procurement","Release independence: creator versus releaser"],"question":"Can an AP-only ruleset establish Procurement coverage?","options":["Yes","No; confirm Procurement-specific risk IDs"],"answer":1},{"title":"2. Run risk analysis and validate usage","objective":"Identify users with conflicting access and distinguish entitlement from actual use.","action":"Run Procurement-scoped Access Risk Analysis, preserve selection criteria and results, and inspect SUIM usage evidence for flagged users. Case: seven users flagged; two exercised both capabilities during the test period.","evidence":"THORNFIELD-B07-AC-05-SUIM-UsageHistory-2Users.png","screen":"Illustrative GRC/SUIM review","fields":["Flagged users: 7","Both capabilities used: 2","Mitigation evidence: ______"],"question":"What does a conflict count alone prove?","options":["The full business impact","Potential conflict requiring validation"],"answer":1},{"title":"3. Interview and inspect role design","objective":"Distinguish role-design defects, assignments and ruleset artifacts.","action":"Interview the business process owner about what the access allows. Trace relevant exceptions to SUIM/PFCG or underlying authorizations. Search similar role structures in Facilities and IT Procurement.","evidence":"THORNFIELD-B07-AC-05-BPO-Interview-Notes.docx; THORNFIELD-B07-AC-05-CrossDept-RoleSearch.xlsx","screen":"Illustrative cross-department role check","fields":["Departments with same pattern: 2","Facilities: flagged","IT Procurement: flagged"],"question":"Should the finding stop at the seven Procurement users?","options":["Yes","No; evaluate the wider role pattern"],"answer":1},{"title":"4. Test PO creator versus releaser","objective":"Confirm purchase orders above the release threshold were approved independently.","action":"Compare PO creator with releaser for above-threshold purchase orders using EKKO and release-change evidence from CDHDR/CDPOS. Case: two of 46 POs were created and released by the same user, HKOWALSKI.","evidence":"THORNFIELD-B07-AC-05-EKKO-CreatorVsReleaser.xlsx","screen":"Illustrative PO release analysis","fields":["Above-threshold POs: 46","Same creator/releaser: 2","User: HKOWALSKI"],"question":"What does matching creator and releaser indicate?","options":["A potential operating failure requiring investigation","A compliant independent approval"],"answer":0},{"title":"5. Conclude and assemble evidence","objective":"Report Procurement SoD and PO-release issues with a complete evidence trail.","action":"Document the previously untested Procurement SoD risk, seven flagged users, two who exercised both permissions, same pattern in two other departments and two same-user PO releases. Recommend extending the risk ruleset, remediating flagged roles and retesting non-finance departments. Index all five evidence items.","evidence":"GRC ProcurementScope result; SUIM usage; BPO notes; cross-department search; EKKO creator-versus-releaser","screen":"Illustrative reviewer conclusion","fields":["7 conflicts; 2 exercised","2/46 same-user PO releases","Action: ruleset, roles, wider retest"],"question":"What must the conclusion link?","options":["Only the GRC result count","Access risk, actual use, PO operation and evidence"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab07_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab07_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab07-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 7 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab07_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
