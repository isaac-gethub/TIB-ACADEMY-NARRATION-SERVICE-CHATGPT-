<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 2 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 2 — The Emergency Change</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab02.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define change-control scope","audio":1,"objective":"Verify that production transports were authorised, tested and approved before migration, and that import access was restricted.","action":"Document the production SID/client, testing period, full import population, change approval requirements, emergency process and exception conditions before opening SAP.","evidence":"Control scope, approved period, authorised Basis group, population definition and exception criteria.","screen":"Workpaper · Change-control scope","fields":["Production SID / client: ______","Testing period: ______","Approved importer group: ______","Emergency procedure: ______"],"question":"What must define the population?","options":["All production imports during the agreed period","Only transports with tickets"],"answer":0},{"title":"2. Extract complete STMS import history","audio":2,"objective":"Establish the complete production import population before sampling or matching tickets.","action":"Use /nSTMS → Import Overview → target production system → Import History. Set the testing period and preserve the selection criteria and raw export. Record transport ID, owner, import date/time and return code.","evidence":"STMS selection screen, full import-history result, untouched raw export and reconciliation.","screen":"Illustrative STMS import history","fields":["System: PRD","Period: [agreed test dates]","Transport ID | Owner | Imported at | RC","Full population: reconcile to scope"],"question":"Which is the best population source?","options":["Change tickets supplied by management","Production STMS Import History"],"answer":1},{"title":"3. Trace transport objects and client settings","audio":3,"objective":"Inspect what was imported and assess production-client configuration.","action":"Use /nSE01 in display mode to inspect sampled request attributes and object lists, including programs, table entries and configuration. Use /nSCC4 in display mode to record production client change/transport settings. Do not edit.","evidence":"SE01 object-list captures per sampled transport and SCC4 production client settings.","screen":"Illustrative SE01 / SCC4 display","fields":["/nSE01 → Request → Display","Object list: programs / tables / configuration","/nSCC4 → Production client → Display","Do not change configuration"],"question":"Why inspect SE01 objects?","options":["To understand what the transport actually changed","To replace approval evidence"],"answer":0},{"title":"4. Reconcile tickets and classify exceptions","audio":4,"objective":"Test whether each production import had timely approval and an authorised importer.","action":"Match each STMS import to its change ticket. Compare approval timestamp with import timestamp and verify importer authorisation. Classify no ticket, approval after import or importer outside authorised Basis group. The Thornfield case has six imports without approved tickets, all over one weekend by one user. Retrospective Monday tickets do not prove prior approval.","evidence":"Exception reconciliation with STMS timestamps, ticket history, importer group evidence and six case exceptions.","screen":"Illustrative exception register","fields":["Case: 6 imports lacking approved tickets","Timing: single weekend, out of hours","Ticket creation: following Monday","One transport: unrelated configuration change"],"question":"Do tickets created Monday prove weekend preapproval?","options":["Yes","No; timing must substantiate approval"],"answer":1},{"title":"5. Evidence, conclusion and reviewer challenge","audio":5,"objective":"Reach an evidence-supported conclusion and propose a controlled emergency change procedure.","action":"Index system status, STMS selection/results, SE01 sampled object lists, SCC4 settings and Excel reconciliation. Separate management explanation from evidence. Conclude that change control failed for six case imports during one incident without an emergency procedure. Recommend a defined emergency approval window, mandatory justification and post-implementation review.","evidence":"THORNFIELD-B02-CH-01-SystemStatus; STMS-ImportHistory; SE01-ObjectList-[TransportID]; SCC4-ClientSettings; ExceptionClassification workbook, Reconciliation tab.","screen":"Illustrative reviewer workpaper","fields":["Finding: 6 unauthorised/unapproved imports","Cause: no emergency procedure documented","Remediation: emergency change process","Reviewer challenge: evidence vs explanation"],"question":"Which statement is supported?","options":["A later ticket proves preapproval","Six imports lacked approved change tickets at import time"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab02_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab02_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab02-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 2 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab01_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
