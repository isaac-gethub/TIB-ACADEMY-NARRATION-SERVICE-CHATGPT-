<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 3 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 3 — The Approval Limit</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab03.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define policy and population","audio":1,"objective":"Verify manual journal entries above the policy risk threshold received independent approval before posting.","action":"Confirm manual-entry document types with Finance. Define system/client, company codes, period, posting-date versus entry-date scope, policy threshold and exception criteria. Do not select only routed entries.","evidence":"Approved policy, test period, document types, threshold, population definition and reviewer scope.","screen":"Workpaper · Manual journal control","fields":["Policy threshold: $10,000 (case)","Period basis: posting / entry date","Company codes: ______","Manual document types: ______"],"question":"Which population is required?","options":["Only workflow-routed entries","All qualifying manual entries above policy threshold"],"answer":1},{"title":"2. Build complete journal population","audio":2,"objective":"Identify all in-scope manual journal entries, including those never routed for approval.","action":"Run /nFBL3N with company code, G/L and period filters. Supplement with /nSE16N on BKPF/BSEG where needed. Retain selection criteria, raw export and reconciled population. Distinguish posting date from entry date.","evidence":"THORNFIELD-B03-BP-01-FBL3N-Selection-Result and reconciled raw population.","screen":"Illustrative FBL3N / SE16N","fields":["/nFBL3N → company code / G/L / period","/nSE16N → BKPF/BSEG if required","Document type: client validated","Population includes unrouted entries"],"question":"Can a workflow log alone define the population?","options":["No, it excludes entries never routed","Yes, it includes every journal"],"answer":0},{"title":"3. Trace approval and posting times","audio":3,"objective":"Determine whether independent approval occurred before posting for sampled entries.","action":"Use /nFB03 to inspect document header, entered-by, document type and posting date. Use /nSWI1 to inspect workflow log, approver and timestamp. Compare approval time against posting time; retain evidence. Obtain threshold configuration and change history separately.","evidence":"THORNFIELD-B03-BP-01-FB03-DocumentHeader; SWI1-WorkflowLog; ApprovalPostingGap-Calc.","screen":"Illustrative FB03 / SWI1","fields":["Document: ______","Entered by: ______","Approval timestamp: ______","Posting timestamp: ______"],"question":"What proves timely approval?","options":["Ticket or workflow number alone","Independent approval timestamp before posting"],"answer":1},{"title":"4. Investigate threshold failure","audio":4,"objective":"Identify how an incorrect threshold distorted the test population and misleadingly produced a clean sample.","action":"Compare documented policy threshold $10,000 with configured workflow threshold $100,000 from January 3 to June 6. Case: 412 manual entries totaling $18.4 million above policy threshold were not routed. The 25-entry sample drawn only from routed entries was clean but structurally excluded unrouted exceptions.","evidence":"ThresholdConfig-ChangeHistory; full population reconciliation; 412 unrouted-entry case analysis; sample-selection critique.","screen":"Illustrative policy/config comparison","fields":["Policy: $10,000","Configured: $100,000","Case unrouted: 412 entries / $18.4m","Routed-only sample: 25 approved"],"question":"Why was the 25-entry sample misleading?","options":["It excluded entries never routed","25 is always too small"],"answer":0},{"title":"5. Conclude and challenge","audio":5,"objective":"Produce an evidence-led conclusion that distinguishes configuration failure from sample performance.","action":"Conclude that routing configuration did not match policy for the period and entries from $10,000 to $100,000 were excluded from the original routed-only sample. Recommend correcting threshold configuration, retesting previously unrouted entries and measuring approval-to-posting gaps. Index all five required exhibits and reviewer questions.","evidence":"FBL3N-Selection-Result; FB03-DocumentHeader; SWI1-WorkflowLog; ThresholdConfig-ChangeHistory; ApprovalPostingGap-Calc.","screen":"Illustrative workpaper closeout","fields":["Finding: threshold configuration mismatch","Excluded population: $10k–$100k","Action: correct / retest / quantify timing","Reviewer: ______"],"question":"What is the key lesson?","options":["A clean sample proves control effectiveness","A clean sample cannot rescue a flawed population"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab03_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab03_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab03-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 3 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab01_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
