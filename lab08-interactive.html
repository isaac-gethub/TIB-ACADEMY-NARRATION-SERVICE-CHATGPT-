<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 8 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 8 — The Third Party</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab08.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define vendor change control scope","objective":"Confirm outsourced vendor changes carry the same required evidence trail as internal changes.","action":"Define test period, target systems, vendor service accounts, approval requirements and contract reporting format. Preserve population and exception criteria before running SAP reports.","evidence":"THORNFIELD-B08-CH-03-STMS-VendorAccount-Population.png","screen":"Vendor change testing scope","fields":["Vendor service accounts: ______","Testing period: ______","Target systems: ______"],"question":"Which source should define completeness?","options":["Vendor self-report alone","Independent SAP system logs reconciled to vendor reporting"],"answer":1},{"title":"2. Extract STMS and SM20 activity","objective":"Identify the complete population of vendor-executed transports.","action":"Use /nSTMS, Import Overview, target system, Import History and period filters; use /nSM20 for approved security audit log selection by user/time. Retain parameters, raw outputs and account mapping. Case: 31 transports in SAP logs.","evidence":"THORNFIELD-B08-CH-03-STMS-VendorAccount-Population.png","screen":"Illustrative STMS and SM20 extraction","fields":["SAP vendor-account transports: 31","Account mapping: ______","Selection evidence: ______"],"question":"What was the independent SAP transport count?","options":["27","31"],"answer":1},{"title":"3. Reconcile vendor self-reported log","objective":"Identify missing or misclassified changes in vendor reporting.","action":"Obtain vendor change log for exactly the same period and reconcile transport IDs against SAP. Case: vendor reported 27 transports versus 31 in SAP. Four were classified as routine maintenance and omitted from vendor reporting.","evidence":"THORNFIELD-B08-CH-03-VendorChangeLog-Export.xlsx; THORNFIELD-B08-CH-03-Reconciliation-VarianceDetail.xlsx","screen":"Illustrative transport reconciliation","fields":["SAP transports: 31","Vendor-reported: 27","Variance: 4"],"question":"What caused the four-item gap?","options":["Vendor excluded routine maintenance","Four transports had no CAB ticket"],"answer":0},{"title":"4. Independently verify approval evidence","objective":"Test approval trail without accepting vendor assertions at face value.","action":"Trace sampled vendor transports to Thornfield's STMS/SM20 evidence and CAB records; compare approval and import timestamps and check emergency justification windows. All 31 case transports had valid CAB tickets, despite vendor reporting omissions.","evidence":"STMS vendor population and reconciled CAB references","screen":"Illustrative CAB approval trace","fields":["Valid CAB tickets: 31/31","Emergency timing: ______","Reviewer: ______"],"question":"What did independent verification show?","options":["All 31 had valid CAB tickets","The four omitted transports were unapproved"],"answer":0},{"title":"5. Conclude and escalate contract issue","objective":"Distinguish approval effectiveness from incomplete vendor reporting.","action":"Conclude vendor self-report understated actual activity by four transports, although all 31 were independently confirmed approved. Recommend vendor change log use Thornfield's transport definition without unilateral exclusions. Flag contractual reporting interpretation for Legal/Procurement at renewal. Index population, vendor export and variance detail.","evidence":"STMS population; vendor log export; reconciliation variance detail","screen":"Illustrative final assessment","fields":["Reporting gap: 4 transports","Approval evidence: 31/31","Contract action: no unilateral exclusions"],"question":"Which finding is supported?","options":["Four changes were unapproved","Four changes were omitted from vendor reporting"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab08_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab08_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab08-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 8 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab08_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
