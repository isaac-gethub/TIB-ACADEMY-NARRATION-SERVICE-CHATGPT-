<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 6 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 6 — The Other Ledger</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab06.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Define acquired-entity control","objective":"Assess whether the acquired entity's manual journal review is enforced by a system or only described in policy.","action":"Document the acquisition date, nine-month review period, complete manual journal population, required reviewer and review evidence. Obtain written confirmation from the controller whether any system enforcement exists.","evidence":"THORNFIELD-B06-BP-04-ControllerConfirmation-Email.pdf","screen":"Illustrative controller confirmation","fields":["Entity: acquired company","Control: manual journal review","Enforcement: none (case)"],"question":"What must be confirmed first?","options":["Whether a system actually enforces review","Whether the policy document exists"],"answer":0},{"title":"2. Obtain all monthly sign-offs","objective":"Establish the complete compensating-control evidence population since acquisition.","action":"Request all monthly reviewer sign-off emails for the full nine-month period, not a preselected sample. Reconcile the month-by-month evidence index to the acquisition period.","evidence":"THORNFIELD-B06-BP-04-SignoffEmail-Population.xlsx","screen":"Illustrative nine-month evidence index","fields":["Months in scope: 9","Months evidenced: 6","Months without evidence: 3"],"question":"Can a six-month evidence set stand for all nine months?","options":["Yes, if the six are clean","No; the other three remain unevidenced"],"answer":1},{"title":"3. Test the underlying entries","objective":"Determine whether reviews in evidenced months actually occurred.","action":"Select 25 manual journal entries from the six months with sign-off evidence and trace each to its reviewer and supporting review documentation. Record the sample's limitation: it cannot demonstrate operation in the three missing months.","evidence":"THORNFIELD-B06-BP-04-SampleTest-25Entries.xlsx","screen":"Illustrative 25-entry sample","fields":["Sample: 25 entries","25 of 25 reviewed","Coverage: only six evidenced months"],"question":"What does the clean 25-entry sample establish?","options":["All nine months operated effectively","The sampled entries from evidenced months were reviewed"],"answer":1},{"title":"4. Separate design gap from evidence gap","objective":"Distinguish unenforced control design from missing compensating-control evidence.","action":"Record controller confirmation that no system mechanism enforces review and the process is manual. Document the three months with no sign-off evidence as open for retrospective substantive testing. Do not treat lack of reported incidents as proof review occurred.","evidence":"ControllerConfirmation-Email.pdf; SignoffEmail-Population.xlsx","screen":"Illustrative issue assessment","fields":["Design gap: no system enforcement","Operation gap: 3 of 9 months missing","Open item: retrospective testing"],"question":"Does no reported issue prove review occurred?","options":["Yes","No"],"answer":1},{"title":"5. Conclude and assemble evidence","objective":"Issue a supportable acquired-entity control assessment and action plan.","action":"Conclude that no system-enforced review exists and manual compensating-control evidence is missing for one-third of the period. Recommend system-enforced approval before group SAP migration and retrospective substantive testing for the three unevidenced months. Index controller confirmation, monthly sign-off population and 25-entry sample.","evidence":"THORNFIELD-B06-BP-04-ControllerConfirmation-Email.pdf; SignoffEmail-Population.xlsx; SampleTest-25Entries.xlsx","screen":"Illustrative conclusion workpaper","fields":["6 of 9 months evidenced","3 months unresolved","Remediation: enforce review and retrospectively test"],"question":"Which conclusion is supportable?","options":["All months passed","Six months evidenced; three months remain unresolved"],"answer":1}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab06_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab06_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab06-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 6 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab06_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
