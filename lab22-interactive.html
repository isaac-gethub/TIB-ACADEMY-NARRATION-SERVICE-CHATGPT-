<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIB Academy | Lab 22 Interactive</title><style>body{margin:0;background:#edf2f8;color:#16345b;font:16px/1.55 system-ui}header{background:#163968;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}header h1{margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:12px;padding:20px}nav button{display:block;width:100%;margin:7px 0;text-align:left;background:#f0f4f9;color:#18375c;border:1px solid #dce5f1;border-radius:7px;padding:11px;cursor:pointer}nav button.active{background:#173c70;color:white}button.action{background:#173c70;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px}textarea,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bcc9d9;border-radius:6px}textarea{min-height:100px}audio{width:100%;margin:10px 0}figure{margin:18px 0;border:1px solid #bdcbdb;border-radius:9px;overflow:hidden}figcaption{padding:10px;background:#eef3f8;font-size:13px}.sapbar{background:#d7e4ef;padding:10px;font-weight:bold}.sapbody{background:#f7f9fb;padding:20px}.sapfield{background:white;border:1px solid #bac8d9;padding:7px 12px;display:inline-block;margin:6px}label{display:block;margin:10px 0}small{color:#617185}.progress{background:#dce6f1;border-radius:10px;overflow:hidden}.progress div{background:#3671a9;height:10px;width:0}#feedback{font-weight:bold}a{color:#225a9b}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><small style="color:#d8e8fb">TIB SYSTEMS · THE SAP CONTROLS CONSULTANT — THE FULL SWEEP</small><h1>Lab 22 — The Indirect Access</h1><div>Interactive execution companion · Thornfield fictitious training engagement</div></header><main><nav><strong>Guided stages</strong><div id="menu"></div><div class="progress"><div id="bar"></div></div><p id="count"></p><p><a href="/lab22.html">Original five-section audio page</a></p></nav><article><h2 id="title"></h2><p id="objective"></p><audio id="audio" controls preload="none"></audio><p><a id="download" download>Download this narration</a></p><figure><div class="sapbar" id="screenTitle"></div><div class="sapbody" id="screenBody"></div><figcaption>Illustrative training screen — not an actual SAP screenshot or live system output. Follow your client's actual configuration.</figcaption></figure><h3>Consultant action</h3><p id="action"></p><h3>Evidence and decision</h3><p id="evidence"></p><label for="notes">Your workpaper notes (stored in this browser only)</label><textarea id="notes" placeholder="Record your population, parameters, evidence reference, and conclusion"></textarea><label><input id="done" type="checkbox" style="width:auto"> I have reviewed the procedure and documented the evidence requirement</label><div id="quiz"></div><p id="feedback" role="status"></p><button class="action" id="prev">Previous</button><button class="action" id="next">Save & Next</button><button class="action" id="export">Export workpaper notes</button></article></main><script>const stages=[{"title":"1. Inventory RFC connections","objective":"Identify third-party access into SAP under generic or service users.","action":"Review SM59 active RFC destinations. Case: 12 active connections, three carrying material transaction volumes.","evidence":"THORNFIELD-B22-LC-02-SM59-RFCInventory.xlsx","screen":"Illustrative SM59 RFC inventory","fields":["Active connections: 12","Material connections: 3"],"question":"How many active RFC connections were found?","options":["12","3"],"answer":0},{"title":"2. Analyze transaction volume","objective":"Quantify external transactions by interface and business type.","action":"Use ST03N and SE16N to analyze a representative period. Three connections exceed 500 transactions daily.","evidence":"THORNFIELD-B22-LC-02-ST03N-VolumeAnalysis.xlsx","screen":"Illustrative volume report","fields":["High-volume connections: 3","Threshold: over 500 per day"],"question":"Which activity requires closer review?","options":["Material business transaction volumes","Connection name alone"],"answer":0},{"title":"3. Review USMM classification","objective":"Compare technical user classification with actual usage.","action":"Review USMM measurement results. All three material connections are classified technical/background, rather than named business users.","evidence":"THORNFIELD-B22-LC-02-USMM-Classification-Export.png","screen":"Illustrative USMM classification","fields":["Connections reviewed: 3","Classification: technical/background"],"question":"Does a technical classification settle licensing treatment?","options":["Yes","No"],"answer":1},{"title":"4. Identify business-equivalent transactions","objective":"Determine whether technical interfaces perform substantive business activity.","action":"Review transaction content. The three connections perform order creation and invoice posting indirectly through SAP.","evidence":"THORNFIELD-B22-LC-02-ST03N-VolumeAnalysis.xlsx","screen":"Illustrative transaction composition","fields":["Order creation: observed","Invoice posting: observed"],"question":"What is the supported finding?","options":["Business-equivalent activity through interfaces","Proven licensing violation"],"answer":0},{"title":"5. Escalate formal licensing assessment","objective":"Distinguish technical observations from contractual licensing conclusions.","action":"Document three material RFC connections with business-equivalent activity and technical classification. Escalate to IT asset management, Legal and licensing counsel before license true-up; do not assert a final license liability.","evidence":"SM59-RFCInventory.xlsx; ST03N-VolumeAnalysis.xlsx; USMM-Classification-Export.png","screen":"Illustrative indirect access finding","fields":["Potential exposure: 3 connections","Formal assessment: pending"],"question":"Who should determine licensing exposure?","options":["IT, Legal and licensing specialists","The technical tester alone"],"answer":0}];let i=0;const $=id=>document.getElementById(id);const saved=()=>{try{return JSON.parse(localStorage.getItem('tib_lab22_workpaper')||'{}')}catch{return {}}};let state=saved();function store(){localStorage.setItem('tib_lab22_workpaper',JSON.stringify(state))}function render(){const s=stages[i];$('menu').innerHTML=stages.map((x,j)=>'<button class="'+(i===j?'active':'')+'" data-step="'+j+'">'+(state[j]?.done?'✓ ':'')+x.title+'</button>').join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();i=Number(b.dataset.step);render()});$('title').textContent=s.title;$('objective').textContent=s.objective;$('action').textContent=s.action;$('evidence').textContent=s.evidence;$('audio').src='/lab22-section-'+s.audio+'.mp3';$('download').href=$('audio').src;$('screenTitle').textContent=s.screen;$('screenBody').innerHTML=s.fields.map(f=>'<div class="sapfield"></div>').join('');[...$('screenBody').children].forEach((e,k)=>e.textContent=s.fields[k]);$('notes').value=state[i]?.notes||'';$('done').checked=!!state[i]?.done;$('quiz').innerHTML='<h3>Knowledge check</h3><p>'+s.question+'</p>'+s.options.map((o,k)=>'<label><input type="radio" name="answer" value="'+k+'" '+(state[i]?.answer===k?'checked':'')+' style="width:auto"> '+o+'</label>').join('');$('feedback').textContent=state[i]?.answer===undefined?'':state[i].answer===s.answer?'Correct — evidence-led reasoning.':'Review the procedure and try again.';document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{state[i]={...(state[i]||{}),answer:Number(e.value)};store();render()});$('bar').style.width=(stages.filter((_,j)=>state[j]?.done).length/5*100)+'%';$('count').textContent=stages.filter((_,j)=>state[j]?.done).length+' of 5 stages acknowledged';$('prev').disabled=i===0;$('next').textContent=i===4?'Save':'Save & Next'}function save(){state[i]={...(state[i]||{}),notes:$('notes').value,done:$('done').checked};store()}$('next').onclick=()=>{save();if(i<4)i++;render()};$('prev').onclick=()=>{save();i--;render()};$('export').onclick=()=>{save();const lines=['TIB Academy Lab 22 — Learner Workpaper','Thornfield fictional case',...stages.flatMap((s,j)=>['',s.title,'Evidence: '+s.evidence,'Notes: '+(state[j]?.notes||'[not entered]'),'Reviewed: '+(state[j]?.done?'Yes':'No'),'Knowledge check: '+(state[j]?.answer===s.answer?'Correct':'Not passed')])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='TIB_Lab22_Workpaper.txt';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
